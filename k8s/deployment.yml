apiVersion: apps/v1
kind: Deployment
metadata:
  name: finan-deploy
  namespace: financial

spec:
  replicas: 1

  selector:
    matchLabels:
      app: finan

  template:
    metadata:
      labels:
        app: finan
      annotations:
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: financial-sa

      containers:
        - name: my-finan
          image: financialacr.azurecr.io/financial-re:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: financial-secret
                  key: openrouter-api-key

            - name: NEWS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: financial-secret
                  key: news-api-key

            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: financial-secret
                  key: langfuse-public-key

            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: financial-secret
                  key: langfuse-secret-key

            - name: LANGFUSE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: financial-secret
                  key: langfuse-base-url

          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: financial-keyvault
